name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Typecheck, tests, migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: amaracus
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: amaracus_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://amaracus:ci_only_password@localhost:5432/amaracus_ci?schema=public
      DIRECT_URL: postgresql://amaracus:ci_only_password@localhost:5432/amaracus_ci?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @amaracus/types --filter @amaracus/crypto-core --filter @amaracus/database --filter @amaracus/sdk --filter amaracus build
      - run: pnpm --filter api exec tsc --noEmit
      - run: pnpm --filter web typecheck
      - run: pnpm --filter api test --ci --forceExit
        env:
          NODE_ENV: test
      - run: pnpm --filter @amaracus/database db:deploy
      - name: Migrations match the schema
        working-directory: packages/database
        run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:4000
            NEXT_PUBLIC_APP_URL=http://localhost:3000
